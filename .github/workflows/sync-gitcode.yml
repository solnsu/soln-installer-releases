name: Sync release to GitCode

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to sync (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitcode-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPOSITORY: lunaris_soln/soln-installer-releases
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test sync validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Mirror and verify release attachments
        run: python3 scripts/sync_gitcode.py
